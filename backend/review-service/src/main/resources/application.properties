spring.application.name=review-service
server.port=8084

# Database Configuration
spring.datasource.url=${POSTGRES_URL}/review_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://10.0.2.2:8081/realms/roadies-app
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/roadies-app/protocol/openid-connect/certs
# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# configurazione Retry
resilience4j.retry.instances.travelService.maxAttempts=3
resilience4j.retry.instances.travelService.waitDuration=2s
resilience4j.retry.instances.travelService.ignoreExceptions=feign.FeignException.Conflict

# configurazione Circuit Breaker
resilience4j.circuitbreaker.instances.travelService.registerHealthIndicator=true
# misura le ultime 10 chiamate
resilience4j.circuitbreaker.instances.travelService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.travelService.failureRateThreshold=50
# aspetta 5 secondi prima di testare se il servizio è tornato online
resilience4j.circuitbreaker.instances.travelService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.travelService.ignoreExceptions=feign.FeignException.Conflict


travel-service.url=http://localhost:8082