spring.application.name=chat-service

# Database Chat
spring.datasource.url=${POSTGRES_URL}/chat_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chi emette il JWT (Configurazione allineata con lo user-service)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://10.0.2.2:8081/realms/roadies-app
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/roadies-app/protocol/openid-connect/certs

chat.encryption.key=${SECRET_KEY}

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

server.port=8086