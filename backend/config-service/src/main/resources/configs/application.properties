eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://10.0.2.2:8081/realms/roadies-app
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/roadies-app/protocol/openid-connect/certs

spring.messages.basename=messages, i18n.list
spring.messages.fallback-to-system-locale=false

spring.rabbitmq.host=rabbitmq-server

minio.url=http://minio:9000
minio.external-url=http://10.0.2.2:9000
minio.access-key=${MINIO_ADMIN}
minio.secret-key=${MINIO_ADMIN_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0