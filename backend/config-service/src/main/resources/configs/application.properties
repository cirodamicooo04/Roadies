eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/roadies-app
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/roadies-app/protocol/openid-connect/certs

spring.messages.basename=messages, i18n.list
spring.messages.fallback-to-system-locale=false

minio.url=http://localhost:9000
minio.access-key=${MINIO_ADMIN}
minio.secret-key=${MINIO_ADMIN_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB